[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dice"
version = "0.1.0"
description = "DiceMaster student SDK — web simulator backend"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["dice"]
